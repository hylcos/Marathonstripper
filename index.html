<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Retouch</title>
<meta name="description" content="Remove stamps, timestamps and blemishes from your own photos. Everything runs locally in your browser.">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5b6470;
    --border: #d9dde3; --accent: #1f6feb; --accent-text: #ffffff; --mask: rgba(235, 64, 52, 0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #9aa4b1;
      --border: #2a313a; --accent: #4c8dff; --accent-text: #0b0e12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 260px 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  aside { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 14px; align-self: start; }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .group h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button, .file { appearance: none; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 14px; cursor: pointer; }
  button:hover, .file:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: -2px; }
  button:disabled { opacity: .5; cursor: default; }
  .file input { display: none; }
  input[type=range] { width: 100%; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
  #stage { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; min-height: 360px; display: flex; align-items: center; justify-content: center; overflow: auto; position: relative; }
  #drop { color: var(--muted); text-align: center; padding: 40px 16px; }
  #wrap { position: relative; display: none; touch-action: none; }
  #wrap canvas { display: block; max-width: 100%; height: auto; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  #thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
  #thumbs img { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; border: 2px solid transparent; cursor: pointer; }
  #thumbs img.active { border-color: var(--accent); }
  #status { font-size: 13px; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>
<header>
  <h1>Photo Retouch</h1>
  <p>Remove date stamps, sensor spots and other unwanted marks from your own photos. Files never leave your browser.</p>
</header>
<main>
  <aside>
    <div class="group">
      <h2>Photos</h2>
      <label class="file">Open images…<input id="file" type="file" accept="image/*" multiple></label>
      <div id="thumbs"></div>
    </div>
    <div class="group">
      <h2>Tool</h2>
      <div class="row">
        <button id="toolMask" aria-pressed="true">Heal brush</button>
        <button id="toolClone" aria-pressed="false">Clone</button>
      </div>
      <p class="hint" id="toolHint">Paint over the mark, then press Remove.</p>
      <label>Brush size <span id="sizeVal">24</span>px
        <input id="size" type="range" min="2" max="200" value="24"></label>
    </div>
    <div class="group">
      <h2>Actions</h2>
      <div class="row">
        <button id="apply" class="primary">Remove</button>
        <button id="clearMask">Clear mask</button>
      </div>
      <div class="row">
        <button id="undo">Undo</button>
        <button id="reset">Revert</button>
        <button id="download">Download</button>
      </div>
      <div id="status"></div>
    </div>
  </aside>
  <section id="stage">
    <div id="drop">Drop images here or use <strong>Open images</strong>.</div>
    <div id="wrap">
      <canvas id="canvas"></canvas>
      <canvas id="overlay"></canvas>
    </div>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  const overlay = $('overlay'), octx = overlay.getContext('2d');
  const stage = $('stage'), wrap = $('wrap'), drop = $('drop');
  const status = msg => { $('status').textContent = msg || ''; };

  const photos = []; // { name, original: ImageData, history: ImageData[], thumb }
  let current = -1, tool = 'mask', brush = 24;
  let mask = null; // Uint8Array, 1 = to fill
  let cloneSrc = null, cloneOffset = null, drawing = false, last = null;

  // ---------- loading ----------
  function loadFiles(files) {
    [...files].filter(f => f.type.startsWith('image/')).forEach(file => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        const cx = c.getContext('2d');
        cx.drawImage(img, 0, 0);
        const data = cx.getImageData(0, 0, c.width, c.height);
        const thumb = document.createElement('img');
        thumb.src = url; thumb.alt = file.name;
        const idx = photos.push({ name: file.name, original: data, history: [], current: data }) - 1;
        thumb.onclick = () => select(idx);
        $('thumbs').appendChild(thumb);
        photos[idx].thumb = thumb;
        if (current < 0) select(idx);
      };
      img.src = url;
    });
  }
  $('file').onchange = e => loadFiles(e.target.files);
  stage.addEventListener('dragover', e => e.preventDefault());
  stage.addEventListener('drop', e => { e.preventDefault(); loadFiles(e.dataTransfer.files); });

  function select(i) {
    if (current >= 0) photos[current].current = ctx.getImageData(0, 0, canvas.width, canvas.height);
    current = i;
    const p = photos[i];
    canvas.width = overlay.width = p.current.width;
    canvas.height = overlay.height = p.current.height;
    ctx.putImageData(p.current, 0, 0);
    mask = new Uint8Array(canvas.width * canvas.height);
    cloneSrc = cloneOffset = null;
    drawOverlay();
    drop.style.display = 'none'; wrap.style.display = 'block';
    photos.forEach((q, j) => q.thumb.classList.toggle('active', j === i));
    status(`${p.name} · ${canvas.width}×${canvas.height}`);
  }

  // ---------- tools ----------
  function setTool(t) {
    tool = t;
    $('toolMask').setAttribute('aria-pressed', t === 'mask');
    $('toolClone').setAttribute('aria-pressed', t === 'clone');
    $('toolHint').textContent = t === 'mask'
      ? 'Paint over the mark, then press Remove.'
      : 'Alt/Shift+click (or long press) to pick a source, then paint.';
    drawOverlay();
  }
  $('toolMask').onclick = () => setTool('mask');
  $('toolClone').onclick = () => setTool('clone');
  $('size').oninput = e => { brush = +e.target.value; $('sizeVal').textContent = brush; };

  function toImage(e) {
    const r = overlay.getBoundingClientRect();
    return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };
  }
  function scaleFactor() { return canvas.width / overlay.getBoundingClientRect().width; }

  function paintMask(a, b) {
    const rad = brush * scaleFactor() / 2, W = canvas.width, H = canvas.height;
    const steps = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / Math.max(1, rad / 3)));
    for (let s = 0; s <= steps; s++) {
      const cx = a.x + (b.x - a.x) * s / steps, cy = a.y + (b.y - a.y) * s / steps;
      const x0 = Math.max(0, Math.floor(cx - rad)), x1 = Math.min(W - 1, Math.ceil(cx + rad));
      const y0 = Math.max(0, Math.floor(cy - rad)), y1 = Math.min(H - 1, Math.ceil(cy + rad));
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++)
        if ((x - cx) ** 2 + (y - cy) ** 2 <= rad * rad) mask[y * W + x] = 1;
    }
  }

  function paintClone(a, b) {
    const rad = brush * scaleFactor() / 2, W = canvas.width, H = canvas.height;
    const x0 = Math.max(0, Math.floor(Math.min(a.x, b.x) - rad)), x1 = Math.min(W - 1, Math.ceil(Math.max(a.x, b.x) + rad));
    const y0 = Math.max(0, Math.floor(Math.min(a.y, b.y) - rad)), y1 = Math.min(H - 1, Math.ceil(Math.max(a.y, b.y) + rad));
    const img = ctx.getImageData(0, 0, W, H), d = img.data;
    const steps = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / Math.max(1, rad / 3)));
    for (let s = 0; s <= steps; s++) {
      const cx = a.x + (b.x - a.x) * s / steps, cy = a.y + (b.y - a.y) * s / steps;
      for (let y = Math.max(y0, Math.floor(cy - rad)); y <= Math.min(y1, cy + rad); y++)
        for (let x = Math.max(x0, Math.floor(cx - rad)); x <= Math.min(x1, cx + rad); x++) {
          const dist = Math.hypot(x - cx, y - cy);
          if (dist > rad) continue;
          const sx = Math.round(x + cloneOffset.x), sy = Math.round(y + cloneOffset.y);
          if (sx < 0 || sy < 0 || sx >= W || sy >= H) continue;
          const alpha = Math.min(1, (rad - dist) / (rad * 0.35)); // soft edge
          const di = (y * W + x) * 4, si = (sy * W + sx) * 4;
          for (let k = 0; k < 3; k++) d[di + k] += (d[si + k] - d[di + k]) * alpha;
        }
    }
    ctx.putImageData(img, 0, 0, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
  }

  function drawOverlay(cursor) {
    octx.clearRect(0, 0, overlay.width, overlay.height);
    if (!mask) return;
    const W = overlay.width, H = overlay.height;
    const img = octx.createImageData(W, H), d = img.data;
    for (let i = 0; i < mask.length; i++) if (mask[i]) { d[i*4] = 235; d[i*4+1] = 64; d[i*4+2] = 52; d[i*4+3] = 115; }
    octx.putImageData(img, 0, 0);
    if (tool === 'clone' && cloneSrc) {
      const p = cursor && cloneOffset ? { x: cursor.x + cloneOffset.x, y: cursor.y + cloneOffset.y } : cloneSrc;
      octx.strokeStyle = '#1f6feb'; octx.lineWidth = 2 * scaleFactor();
      octx.beginPath(); octx.arc(p.x, p.y, brush * scaleFactor() / 2, 0, Math.PI * 2); octx.stroke();
    }
  }

  let pressTimer = null;
  overlay.addEventListener('pointerdown', e => {
    if (current < 0) return;
    overlay.setPointerCapture(e.pointerId);
    const p = toImage(e);
    if (tool === 'clone') {
      if (e.altKey || e.shiftKey) { cloneSrc = p; cloneOffset = null; drawOverlay(); return; }
      if (!cloneSrc) {
        pressTimer = setTimeout(() => { cloneSrc = p; cloneOffset = null; drawing = false; drawOverlay(); status('Clone source set'); }, 500);
        status('Pick a source first: Alt/Shift+click or long press');
        return;
      }
      pushHistory();
      if (!cloneOffset) cloneOffset = { x: cloneSrc.x - p.x, y: cloneSrc.y - p.y };
      drawing = true; last = p; paintClone(p, p);
    } else {
      drawing = true; last = p; paintMask(p, p); drawOverlay();
    }
  });
  overlay.addEventListener('pointermove', e => {
    clearTimeout(pressTimer);
    if (current < 0) return;
    const p = toImage(e);
    if (drawing) {
      if (tool === 'clone') paintClone(last, p); else paintMask(last, p);
      last = p;
    }
    drawOverlay(p);
  });
  const end = () => { clearTimeout(pressTimer); drawing = false; last = null; };
  overlay.addEventListener('pointerup', end);
  overlay.addEventListener('pointercancel', end);

  // ---------- history ----------
  function pushHistory() {
    const h = photos[current].history;
    h.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (h.length > 15) h.shift();
  }
  $('undo').onclick = () => {
    if (current < 0) return;
    const prev = photos[current].history.pop();
    if (prev) { ctx.putImageData(prev, 0, 0); status('Undone'); } else status('Nothing to undo');
  };
  $('reset').onclick = () => {
    if (current < 0) return;
    pushHistory(); ctx.putImageData(photos[current].original, 0, 0);
    mask.fill(0); drawOverlay(); status('Reverted to original');
  };
  $('clearMask').onclick = () => { if (mask) { mask.fill(0); drawOverlay(); } };

  $('download').onclick = () => {
    if (current < 0) return;
    const name = photos[current].name.replace(/\.[^.]+$/, '') + '-retouched.jpg';
    canvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, 'image/jpeg', 0.95);
  };

  // ---------- inpainting ----------
  // Onion-peel fill: masked pixels are filled from the boundary inward using a
  // distance-weighted average of known pixels, then lightly smoothed.
  function inpaint(img, m, W, H) {
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (m[y*W+x]) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    if (x1 < 0) return false;
    const R = 4, pad = R + 2;
    x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
    x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
    const d = img.data, todo = new Uint8Array(m), filled = [];
    let front = [];
    const isFront = i => {
      const x = i % W, y = (i / W) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < W && ny < H && !todo[ny*W+nx]) return true;
      }
      return false;
    };
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const i = y * W + x; if (todo[i] && isFront(i)) front.push(i);
    }
    while (front.length) {
      const vals = [];
      for (const i of front) {
        const x = i % W, y = (i / W) | 0;
        let r = 0, g = 0, b = 0, ws = 0;
        for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          const j = ny * W + nx; if (todo[j]) continue;
          const dist2 = dx*dx + dy*dy; if (!dist2 || dist2 > R*R) continue;
          const w = 1 / dist2;
          r += d[j*4] * w; g += d[j*4+1] * w; b += d[j*4+2] * w; ws += w;
        }
        vals.push(ws ? [r/ws, g/ws, b/ws] : null);
      }
      const next = new Set();
      front.forEach((i, k) => {
        if (!vals[k]) return;
        d[i*4] = vals[k][0]; d[i*4+1] = vals[k][1]; d[i*4+2] = vals[k][2];
        todo[i] = 0; filled.push(i);
      });
      for (const i of front) {
        const x = i % W, y = (i / W) | 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && ny >= 0 && nx < W && ny < H && todo[ny*W+nx]) next.add(ny*W+nx);
        }
      }
      front = [...next];
    }
    // Smooth the filled region to remove streaks.
    for (let it = 0; it < 6; it++) for (const i of filled) {
      const x = i % W, y = (i / W) | 0;
      for (let k = 0; k < 3; k++) {
        let s = 0, n = 0;
        if (x > 0) { s += d[(i-1)*4+k]; n++; } if (x < W-1) { s += d[(i+1)*4+k]; n++; }
        if (y > 0) { s += d[(i-W)*4+k]; n++; } if (y < H-1) { s += d[(i+W)*4+k]; n++; }
        d[i*4+k] = s / n;
      }
    }
    // Re-add a little grain so the patch matches the surrounding noise.
    const grain = estimateNoise(d, m, W, x0, y0, x1, y1);
    for (const i of filled) {
      const n = (Math.random() + Math.random() + Math.random() - 1.5) * grain;
      for (let k = 0; k < 3; k++) d[i*4+k] = Math.max(0, Math.min(255, d[i*4+k] + n));
    }
    return true;
  }

  function estimateNoise(d, m, W, x0, y0, x1, y1) {
    let s = 0, n = 0;
    for (let y = y0 + 1; y < y1; y++) for (let x = x0 + 1; x < x1; x++) {
      const i = y * W + x;
      if (m[i] || m[i-1] || m[i+1] || m[i-W] || m[i+W]) continue;
      const l = j => d[j*4] * .3 + d[j*4+1] * .59 + d[j*4+2] * .11;
      s += Math.abs(4 * l(i) - l(i-1) - l(i+1) - l(i-W) - l(i+W)); n++;
    }
    return n ? Math.min(12, s / n / 4) : 0;
  }

  $('apply').onclick = () => {
    if (current < 0 || !mask.some(v => v)) { status('Paint over an area first'); return; }
    status('Working…');
    setTimeout(() => {
      pushHistory();
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      inpaint(img, mask, canvas.width, canvas.height);
      ctx.putImageData(img, 0, 0);
      mask.fill(0); drawOverlay();
      status('Done. For textured areas, touch up with the Clone tool.');
    }, 20);
  };

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); $('undo').click(); }
  });
})();
</script>
</body>
</html>
